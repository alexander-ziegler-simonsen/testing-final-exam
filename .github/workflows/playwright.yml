name: Playwright Tests
on:
  push:
  pull_request:
jobs:
  e2e-testing:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospital
      POSTGRES_PORT: 5432
    steps:
    - uses: actions/checkout@v4

    - name: Start services
      run: docker compose up -d --build

    - name: Wait for client to be ready
      run: |
        echo "Waiting for client on port 5173..."
        timeout 120 bash -c 'until curl -sf http://localhost:5173 > /dev/null; do sleep 2; done'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Playwright dependencies
      run: pnpm install --frozen-lockfile
      working-directory: ./tests/e2e

    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(pnpm -f ./tests/e2e exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: pnpm exec playwright install --with-deps
      working-directory: ./tests/e2e

    - name: Install Playwright system dependencies only
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: pnpm exec playwright install-deps
      working-directory: ./tests/e2e

    - name: Run Playwright tests
      run: pnpm exec playwright test
      working-directory: ./tests/e2e

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: tests/e2e/playwright-report/
        retention-days: 30
