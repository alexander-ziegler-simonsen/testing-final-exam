name: Playwright Tests (Docker)
on:
  push:
  pull_request:

jobs:
  full-e2e-testing:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    # 1. Run the test steps directly inside the Playwright image
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble # Keep in sync with @playwright/test in tests/e2e/package.json

    # 2. Spin up your backend services in the background instantly
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: HospitalDB
        ports:
          - 5432:5432
        # Ensure database is fully online before starting steps
        options: >-
          --health-cmd "pg_isready -U postgres -d HospitalDB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HOME: /root
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: HospitalDB
      POSTGRES_PORT: 5432
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v4

      # 3. Initialize your database using your schema file, same as local dev
      - name: Initialize Postgres Database
        run: |
          apt-get update && apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h postgres -U postgres -d HospitalDB -f ./initScripts/postgres/01_schema.sql
          PGPASSWORD=postgres psql -h postgres -U postgres -d HospitalDB -f ./initScripts/postgres/02_seed.sql
          PGPASSWORD=postgres psql -h postgres -U postgres -d HospitalDB -f ./initScripts/postgres/03_seed_test_fixtures.sql
          PGPASSWORD=postgres psql -h postgres -U postgres -d postgres -f ./initScripts/postgres/04_create_template.sql

      # 4. Setup .NET SDK to compile and run your API locally
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build API
        run: dotnet build ./api --configuration Debug

      # 5. Start the .NET API in the background (already built above, so this just launches Kestrel)
      - name: Start API Service
        run: dotnet run --project ./api --no-build --no-restore &
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://+:5028
          ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=HospitalDB;Username=postgres;Password=postgres;

      - name: Wait for API to be ready
        run: until curl -s -o /dev/null -w "%{http_code}" http://localhost:5028/api/patient | grep -qE "^(200|401)$"; do sleep 1; done
        timeout-minutes: 2

      # 6. Build the client and run tests
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: ./tests/e2e/pnpm-lock.yaml

      - name: Install Client Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./client

      - name: Install Project Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./tests/e2e

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=${{ matrix.browser }} --reporter=list,html,allure-playwright
        working-directory: ./tests/e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: tests/e2e/playwright-report/
          retention-days: 30

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e-${{ matrix.browser }}
          path: tests/e2e/allure-results/
          retention-days: 30
