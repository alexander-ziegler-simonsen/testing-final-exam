name: Playwright Tests (Docker)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build the API once , use everywhere
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Self-contained, so the test legs need no .NET runtime.
      - name: Publish API
        run: >
          dotnet publish ./api/hospitalApi.csproj -c Release -o ./publish
          -r linux-x64 --self-contained true -p:PublishSingleFile=true

      - uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: ./publish
          retention-days: 1

  e2e:
    needs: build-api
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, lighthouse]

    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble 

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: HospitalDB
        options: >-
          --health-cmd "pg_isready -U postgres -d HospitalDB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HOME: /root # Firefox needed env
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: HospitalDB
      POSTGRES_PORT: 5432
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      VITE_API_BASE_URL: http://localhost:5028
      VITE_API_MOCKING: external-only # .env.e2e is gitignored (*.e2e), so CI sets it here

    steps:
      - uses: actions/checkout@v4

      - name: Initialize database
        env:
          PGHOST: ${{ env.POSTGRES_HOST }}
          PGUSER: ${{ env.POSTGRES_USER }}
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: bash ./tests/e2e/init-db.sh

      - uses: actions/download-artifact@v4
        with:
          name: api-build
          path: ./publish

      - name: Start API
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://+:5028
          ConnectionStrings__DefaultConnection: Host=${{ env.POSTGRES_HOST }};Port=${{ env.POSTGRES_PORT }};Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }};
        run: |
          chmod +x ./publish/hospitalApi
          ./publish/hospitalApi --contentRoot "$(pwd)/publish" > api.log 2>&1 &

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            ./client/pnpm-lock.yaml
            ./tests/e2e/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm --dir ./client install --frozen-lockfile
          pnpm --dir ./tests/e2e install --frozen-lockfile

      - name: Wait for API
        run: |
          curl -s -o /dev/null --max-time 5 --retry 60 --retry-delay 1 --retry-connrefused http://localhost:5028/api/patient || { echo "API did not start. --- api.log ---"; cat api.log; exit 1; }

      - name: Run Playwright (${{ matrix.project }})
        run: pnpm exec playwright test --project=${{ matrix.project }} --reporter=list,html
        working-directory: ./tests/e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: tests/e2e/playwright-report/
          retention-days: 30