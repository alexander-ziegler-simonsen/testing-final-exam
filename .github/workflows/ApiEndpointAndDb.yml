name: API with DB tests

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    apiWithDbTests:
        environment: monoEnv
        runs-on: ubuntu-latest
        timeout-minutes: 15

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
                    POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                    POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=${{ secrets.POSTGRES_DB }};Username=${{ secrets.POSTGRES_USER }};Password=${{ secrets.POSTGRES_PASSWORD }}
            ASPNETCORE_URLS: http://localhost:5028

        steps:
            # 1 Checkout FIRST
            - name: Checkout code
              uses: actions/checkout@v4

            # 2 Install PostgreSQL client (needed for pg_isready + psql)
            - name: Install PostgreSQL client
              run: sudo apt-get update && sudo apt-get install -y postgresql-client

            # 3 Wait for DB
            - name: Wait for PostgreSQL
              run: |
                  until PGPASSWORD=${{ secrets.POSTGRES_PASSWORD }} psql \
                    -h localhost \
                    -U ${{ secrets.POSTGRES_USER }} \
                    -d ${{ secrets.POSTGRES_DB }} \
                    -c '\q'; do
                    echo "Waiting for database..."
                    sleep 2
                  done

            # 4 Setup .NET
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Restore
              run: dotnet restore api/hospitalApi.csproj

            - name: Build
              run: dotnet build api/hospitalApi.csproj --no-restore --configuration Release

            # 5 Initialize schema + seed
            - name: Initialize database
              run: |
                  PGPASSWORD=${{ secrets.POSTGRES_PASSWORD }} psql \
                    -h localhost \
                    -U ${{ secrets.POSTGRES_USER }} \
                    -d ${{ secrets.POSTGRES_DB }} \
                    -f initScripts/postgres/01_schema.sql
                  PGPASSWORD=${{ secrets.POSTGRES_PASSWORD }} psql \
                    -h localhost \
                    -U ${{ secrets.POSTGRES_USER }} \
                    -d ${{ secrets.POSTGRES_DB }} \
                    -f initScripts/postgres/02_seed.sql

            # 6 Setup Node + pnpm for Newman
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"
                  cache-dependency-path: ./tests/endpoints/pnpm-lock.yaml

            - name: Install Newman dependencies
              run: pnpm install --frozen-lockfile
              working-directory: ./tests/endpoints

            - name: Start API
              run: |
                  dotnet run --project api/hospitalApi.csproj --configuration Release --no-build &

            - name: Wait for API
              run: |
                  timeout 90 bash -c 'until nc -z localhost 5028; do sleep 2; done'

            - name: Run Postman Collection
              run: pnpm test
              working-directory: ./tests/endpoints
              env:
                  BASE_URL: http://localhost:5028
                  ALLURE_RESULTS_DIR: ${{ github.workspace }}/tests/endpoints/allure-results

            - name: Upload Allure results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: allure-results-newman
                  path: tests/endpoints/allure-results/
                  retention-days: 30