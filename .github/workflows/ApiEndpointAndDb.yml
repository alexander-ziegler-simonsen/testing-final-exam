name: API with DB tests

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    apiWithDbTests:
        environment: monoEnv
        runs-on: ubuntu-latest
        timeout-minutes: 15

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
                    POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                    POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=${{ secrets.POSTGRES_DB }};Username=${{ secrets.POSTGRES_USER }};Password=${{ secrets.POSTGRES_PASSWORD }}
            ASPNETCORE_URLS: http://localhost:5028

        steps:
            # 1 Checkout FIRST
            - name: Checkout code
              uses: actions/checkout@v4

            # 2 Install PostgreSQL client (needed for pg_isready + psql)
            - name: Install PostgreSQL client
              run: sudo apt-get update && sudo apt-get install -y postgresql-client

            # 3 Wait for DB
            - name: Wait for PostgreSQL
              run: |
                  until PGPASSWORD=${{ secrets.POSTGRES_PASSWORD }} psql \
                    -h localhost \
                    -U ${{ secrets.POSTGRES_USER }} \
                    -d ${{ secrets.POSTGRES_DB }} \
                    -c '\q'; do
                    echo "Waiting for database..."
                    sleep 2
                  done

            # 4 Setup .NET
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Restore
              run: dotnet restore apiProjects/api/hospitalApi.csproj

            - name: Build
              run: dotnet build apiProjects/api/hospitalApi.csproj --no-restore --configuration Release

            # 5 Initialize schema + seed
            - name: Initialize database
              run: |
                  PGPASSWORD=${{ secrets.POSTGRES_PASSWORD }} psql \
                    -h localhost \
                    -U ${{ secrets.POSTGRES_USER }} \
                    -d ${{ secrets.POSTGRES_DB }} \
                    -f initScripts/postgres/01_schema.sql
                  PGPASSWORD=${{ secrets.POSTGRES_PASSWORD }} psql \
                    -h localhost \
                    -U ${{ secrets.POSTGRES_USER }} \
                    -d ${{ secrets.POSTGRES_DB }} \
                    -f initScripts/postgres/02_seed.sql

            # 6 Setup Node for Newman
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install Newman
              run: npm install -g newman

            - name: Start API
              run: |
                  dotnet run --project apiProjects/api/hospitalApi.csproj --configuration Release --no-build &

            - name: Wait for API
              run: |
                  timeout 90 bash -c 'until nc -z localhost 5028; do sleep 2; done'

            - name: Run Postman Collection
              run: |
                  newman run \
                    "https://api.getpostman.com/collections/12590735-d2637d88-8db0-440f-8fc4-311fb39720d5" \
                    --folder "api" \
                    --environment "https://api.getpostman.com/environments/12590735-36583cbb-fb85-4c40-93e4-2f58748a3d6d" \
                    --postman-api-key "${{ secrets.POSTMAN_API_KEY }}" \
                    --env-var "baseUrl=http://localhost:5028"