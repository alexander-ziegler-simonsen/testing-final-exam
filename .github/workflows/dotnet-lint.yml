name: Lint C#

on:
  push:
  pull_request:

jobs:
  dotnet-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Enable dotnet format annotations
        uses: xt0rted/dotnet-format-problem-matcher@v1

      - name: Check API formatting
        id: format-api
        continue-on-error: true
        run: dotnet format api/hospitalApi.csproj --verify-no-changes --report ./format-reports/api

      - name: Check test project formatting
        id: format-tests
        continue-on-error: true
        run: dotnet format api/apiTesting/hospitalApiTesting.csproj --verify-no-changes --report ./format-reports/tests

      - name: Publish formatting summary
        if: always()
        run: |
          api_issues=$(jq 'length' ./format-reports/api/format-report.json)
          tests_issues=$(jq 'length' ./format-reports/tests/format-report.json)
          {
            echo "## dotnet format results"
            echo ""
            echo "| Project | Files needing formatting |"
            echo "|---|---|"
            echo "| api/hospitalApi.csproj | $api_issues |"
            echo "| api/apiTesting/hospitalApiTesting.csproj | $tests_issues |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if formatting issues were found
        if: steps.format-api.outcome == 'failure' || steps.format-tests.outcome == 'failure'
        run: exit 1
