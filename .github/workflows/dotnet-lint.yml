name: Lint C#

on:
  push:
  pull_request:

jobs:
  dotnet-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Turns dotnet format's plain console warnings into inline PR annotations
      # (file + line), instead of a wall of text you have to scroll the log for.
      - name: Enable dotnet format annotations
        uses: xt0rted/dotnet-format-problem-matcher@v1

      # --report writes a JSON file listing every file that needs formatting,
      # even when there are none (empty array) - that's what lets the summary
      # step below always show a result, not just when something's wrong.
      - name: Check API formatting
        id: format-api
        continue-on-error: true
        run: dotnet format api/hospitalApi.csproj --verify-no-changes --report ./format-reports/api

      - name: Check test project formatting
        id: format-tests
        continue-on-error: true
        run: dotnet format api/apiTesting/hospitalApiTesting.csproj --verify-no-changes --report ./format-reports/tests

      # Runs whether the checks above passed or failed, so there's always a
      # summary box on the run page instead of nothing to look at.
      - name: Publish formatting summary
        if: always()
        run: |
          api_issues=$(jq 'length' ./format-reports/api/format-report.json)
          tests_issues=$(jq 'length' ./format-reports/tests/format-report.json)
          {
            echo "## dotnet format results"
            echo ""
            echo "| Project | Files needing formatting |"
            echo "|---|---|"
            echo "| api/hospitalApi.csproj | $api_issues |"
            echo "| api/apiTesting/hospitalApiTesting.csproj | $tests_issues |"
          } >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error above means a failed format check wouldn't fail the
      # job on its own - this makes the job red again if either one failed.
      - name: Fail if formatting issues were found
        if: steps.format-api.outcome == 'failure' || steps.format-tests.outcome == 'failure'
        run: exit 1
