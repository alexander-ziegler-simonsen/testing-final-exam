name: Lint C#

on:
  push:
  pull_request:

jobs:
  dotnet-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Turns dotnet format's plain console warnings into inline PR annotations
      # (file + line), instead of a wall of text you have to scroll the log for.
      - name: Enable dotnet format annotations
        uses: xt0rted/dotnet-format-problem-matcher@v1

      - name: Check API formatting
        run: dotnet format api/hospitalApi.csproj --verify-no-changes

      - name: Check test project formatting
        run: dotnet format api/apiTesting/hospitalApiTesting.csproj --verify-no-changes
