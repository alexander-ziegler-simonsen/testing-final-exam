name: DB Tests

on:
    push:
    pull_request:

permissions:
    contents: read
    checks: write
    pull-requests: write

jobs:
    db-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            # 👉 Install pnpm (pinned version - an unpinned `npm install -g pnpm`
            # is what broke the client unit pipeline previously)
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"
                  cache-dependency-path: ./tests/dbTests/pnpm-lock.yaml

            # 👉 Install deps inside dbTests
            - name: Install dependencies
              working-directory: ./tests/dbTests
              run: pnpm install --frozen-lockfile

            # 👉 Run tests, also writing a JUnit XML report so it can be
            # turned into a job summary (same idea as apiUnitTests.yml's trx file)
            - name: Run DB tests
              working-directory: ./tests/dbTests
              run: pnpm exec vitest run --reporter=junit --outputFile=./test-results/junit.xml

            - name: Publish test summary
              uses: dorny/test-reporter@v3
              if: always()
              with:
                  name: DB test results
                  path: tests/dbTests/test-results/junit.xml
                  reporter: java-junit
