name: Playwright Tests
on:
  push:
  pull_request:

jobs:
  e2e-testing:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    # 1. Run the test steps directly inside the Playwright image
    container:
      image: ://microsoft.com # Match your local version

    # 2. Spin up your backend services in the background instantly
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital
        ports:
          - 5432:5432
        # Ensure database is fully online before starting steps
        options: >-
          --health-cmd "pg_isready -U postgres -d hospital"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospital
      POSTGRES_PORT: 5432
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v4

      # 3. Initialize your database using your schema file
      - name: Initialize Postgres Database
        run: |
          apt-get update && apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h postgres -U postgres -d hospital -f ./initScripts/postgres/init.sql

      # 4. Setup .NET SDK to compile and run your API locally
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0" # Adjust to match your project version

      # 5. Start the .NET API in the background
      - name: Start API Service
        run: |
          dotnet run --project ./apiProjects/api &
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=hospital;Username=postgres;Password=postgres;

      # 6. Build the client and run tests
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: ./tests/e2e/pnpm-lock.yaml

      - name: Install Project Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./tests/e2e

      - name: Run Playwright tests
        run: pnpm exec playwright test
        working-directory: ./tests/e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 30
