name: API unit tests
on:
    push:
    pull_request:
permissions:
    contents: read
    checks: write
    pull-requests: write

jobs:
    apiLocalTests:
        environment: monoEnv
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '10.0.x'

            - name: Restore
              run: dotnet restore api/apiTesting/hospitalApiTesting.csproj

            - name: Build
              run: dotnet build api/apiTesting/hospitalApiTesting.csproj --no-restore --configuration Release

            - name: Test
              run: >
                  dotnet test api/apiTesting/hospitalApiTesting.csproj --no-build --configuration Release
                  --logger "trx;LogFileName=test-results.trx"
                  --results-directory ./TestResults

            - name: Publish test summary
              uses: dorny/test-reporter@v3
              if: always()
              with:
                  name: API unit test results
                  path: TestResults/test-results.trx
                  reporter: dotnet-trx