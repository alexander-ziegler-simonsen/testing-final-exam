name: Lint client

on:
  push:
  pull_request:

jobs:
  lint-client:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.20.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Approve builds
        working-directory: ./client
        run: pnpm approve-builds

      - name: Install dependencies
        working-directory: ./client
        run: pnpm install --frozen-lockfile

      - name: Run oxlint
        working-directory: ./client
        run: pnpm run lint
