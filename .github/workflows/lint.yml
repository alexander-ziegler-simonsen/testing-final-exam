name: Lint client

on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/lint.yml"]
  pull_request:
    paths: ["client/**", ".github/workflows/lint.yml"]

jobs:
  lint-client:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run oxlint
        uses: oxc-project/oxlint-action@v2.0.1
        with:
            working-directory: ./client
            config: configs/.oxlintrc.json
            version: 1.71.0