# SonarCloud project configuration.
# NOTE: you're on Automatic Analysis (scans on push to main, no CI step).
# In that mode SonarCloud ignores sonar.projectKey/organization/host.url
# (those are tied to how the repo is connected in the SonarCloud UI) and
# sonar.sources/sonar.tests are best-effort. The properties that are
# reliably honored in Automatic Analysis are the exclusion/inclusion ones
# below. sonar.sources/sonar.tests are kept here too in case you ever add
# a CI-based scan step (sonar-scanner / GitHub Action), where they matter.
sonar.projectKey=TODO-set-me
sonar.organization=TODO-set-me

# --- Application source ---
sonar.sources=api,client/src
sonar.tests=client/src,api/apiTesting,tests/dbTests,tests/e2e/tests

# Disambiguates test files living alongside source (client/src) or nested
# under a source folder (api/apiTesting), and marks the standalone test
# roots as entirely test code.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,api/apiTesting/**,tests/dbTests/**,tests/e2e/tests/**

# --- Excluded entirely: generated code, build output, fixtures, reports ---
sonar.exclusions=\
  **/bin/**,\
  **/obj/**,\
  **/node_modules/**,\
  **/*.gen.ts,\
  client/src/api/**,\
  client/vitest-example/**,\
  client/docs/**,\
  client/.vitest-attachments/**,\
  api/docs/**,\
  api/swagger/**,\
  **/dist/**,\
  **/pnpm-lock.yaml,\
  **/package-lock.json,\
  tests/endpoints/**,\
  tests/stress-tests/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/*.postman_collection.json,\
  **/*.jmx,\
  **/*.md,\
  compose.yaml,\
  hospitalSystem.slnx,\
  .env.template,\
  runStressTest.sh,\
  stressTestPostNeededCommands.sh,\
  stressTestPreNeededCommands.sh,\
  api/commandsNote.sh,\
  initScripts/postgres/02_seed.sql,\
  initScripts/postgres/03_seed_test_fixtures.sql
